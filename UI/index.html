    body {
      background-color: #f8fafc;

    .custom-scrollbar::-webkit-scrollbar {

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .btn-lift {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-lift:hover {
      transform: translateY(-1px);
    }

    .btn-lift:active {
      transform: scale(0.98);

  </style>
</head>

<body class="min-h-screen flex flex-col antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Default Seed / Mock Trajectories
    const FALLBACK_TRAJECTORIES = [

    ];

    const PRESET_TASKS = [
      { task_id: "t001", title: "Highest Regional Sales in 2023", question: "Which region had the highest total sales in 2023?", difficulty: "EASY" },
      { task_id: "t002", title: "Enterprise Customer Profits", question: "What is the total profit generated by Enterprise customers in 2023?", difficulty: "MEDIUM" },
      { task_id: "t003", title: "Top Revenue Product Category", question: "Which product category produced the highest total revenue across all years?", difficulty: "MEDIUM" },
      { task_id: "t004", title: "Hardware Buyers in 2024", question: "List all customers who purchased Hardware products in 2024 and calculate total revenue across customer segments with joins", difficulty: "HARD" },
      { task_id: "t007", title: "Manager Performance by Region", question: "Find the manager for the region with the lowest sales in 2023 using a join between regions and orders", difficulty: "HARD" },
      { task_id: "t008", title: "Visual Chart Generation", question: "Analyze sales by region and create a bar chart showing which region has the highest sales.", difficulty: "MEDIUM" },
      { task_id: "t009", title: "Customer Segment Pie Chart", question: "Plot a pie chart of revenue by customer segment", difficulty: "MEDIUM" },
      { task_id: "t010", title: "Sales vs Profit Scatter Plot", question: "Create a scatter plot showing the relationship between sales and profit", difficulty: "MEDIUM" },
      { task_id: "t011", title: "Statistical Correlation", question: "Calculate statistical correlation between sales and profit", difficulty: "HARD" }
    ];

    // Dynamic Chart Component (SVG Renderer - Modern Light Theme)
    function DynamicChartRenderer({ spec, chartPath }) {
      if (!spec) return null;
      const { type = "bar", title = "Data Visualization", x = [], y = [], x_label = "X Axis", y_label = "Y Axis" } = spec;
      const fmt = (n) => typeof n === 'number' ? (n >= 1000 ? `$${(n / 1000).toFixed(1)}k` : `$${n.toFixed(1)}`) : String(n);

      return (
        <div className="p-6 bg-slate-50/90 rounded-2xl border border-slate-300 space-y-4 shadow-sm text-slate-900">
          <div className="flex items-center justify-between border-b border-slate-300 pb-3 flex-wrap gap-2">
            <div className="flex items-center space-x-2 font-mono text-sm md:text-base font-bold text-slate-900">
              <span>📊 {title}</span>
            </div>
            <div className="flex items-center space-x-2">
              <span className="text-xs font-mono font-bold uppercase px-3 py-1 bg-brand-50 text-brand-700 rounded-full border border-brand-300">
                {type.toUpperCase()} CHART
              </span>
              <span className="text-xs font-mono font-semibold px-3 py-1 bg-white text-slate-700 rounded-full border border-slate-300 shadow-sm">
                {x.length} Data Points
              </span>
            </div>
          </div>

          {/* Scatter Plot (Light Modern Theme) */}
          {type === "scatter" && (
            <div className="p-4 bg-white rounded-xl border border-slate-300 shadow-sm">
              {(() => {
                const xNums = x.map(v => Number(v) || 0);
                const yNums = y.map(v => Number(v) || 0);
                const xMin = Math.min(...xNums, 0);
                const xMax = Math.max(...xNums, 100);
                const yMin = Math.min(...yNums, 0);
                const yMax = Math.max(...yNums, 100);
                const scaleX = (val) => 60 + ((val - xMin) / (xMax - xMin || 1)) * 340;
                const scaleY = (val) => 165 - ((val - yMin) / (yMax - yMin || 1)) * 125;

                return (
                  <svg className="w-full h-64" viewBox="0 0 450 210">
                    <line x1="50" y1="40" x2="420" y2="40" stroke="#e2e8f0" strokeDasharray="3" />
                    <line x1="50" y1="90" x2="420" y2="90" stroke="#e2e8f0" strokeDasharray="3" />
                    <line x1="50" y1="140" x2="420" y2="140" stroke="#e2e8f0" strokeDasharray="3" />
                    <line x1="50" y1="165" x2="420" y2="165" stroke="#cbd5e1" strokeWidth="1.5" />
                    <line x1="50" y1="30" x2="50" y2="165" stroke="#cbd5e1" strokeWidth="1.5" />

                    {xNums.map((xv, i) => {
                      const yv = yNums[i] || 0;
                      const cx = scaleX(xv);
                      const cy = scaleY(yv);
                      return (
                        <circle key={i} cx={cx} cy={cy} r="6.5" fill="#8b5cf6" stroke="#ffffff" strokeWidth="2" className="hover:r-9 transition cursor-pointer shadow-sm" />
                      );
                    })}

                    <line x1="60" y1="160" x2="410" y2="45" stroke="#f59e0b" strokeWidth="2.5" strokeDasharray="4" />
                    <text x="235" y="194" fill="#475569" fontSize="11" fontWeight="bold" textAnchor="middle">{x_label} (Min: {fmt(xMin)} - Max: {fmt(xMax)})</text>
                    <text x="45" y="42" fill="#64748b" fontSize="10" fontWeight="bold" textAnchor="end">{fmt(yMax)}</text>
                    <text x="45" y="168" fill="#64748b" fontSize="10" fontWeight="bold" textAnchor="end">{fmt(yMin)}</text>
                    <text x="360" y="38" fill="#d97706" fontSize="10" fontWeight="bold">Trendline</text>
                  </svg>
                );
              })()}
            </div>
          )}

          {/* Bar Chart (Light Modern Theme) */}
          {type === "bar" && (
            <div className="p-4 bg-white rounded-xl border border-slate-300 shadow-sm">
              {(() => {
                const yNums = y.map(v => Number(v) || 0);
                const yMax = Math.max(...yNums, 100);
                const barWidth = Math.min(55, Math.floor(330 / (x.length || 1)));

                return (
                  <svg className="w-full h-64" viewBox="0 0 450 210">
                    <line x1="40" y1="40" x2="430" y2="40" stroke="#e2e8f0" strokeDasharray="3" />
                    <line x1="40" y1="100" x2="430" y2="100" stroke="#e2e8f0" strokeDasharray="3" />
                    <line x1="40" y1="165" x2="430" y2="165" stroke="#cbd5e1" strokeWidth="1.5" />

                    {x.map((xv, i) => {
                      const yv = yNums[i] || 0;
                      const h = Math.max(12, ((yv / (yMax || 1)) * 120));
                      const bx = 55 + i * (barWidth + 16);
                      const by = 165 - h;
                      return (
                        <g key={i}>
                          <rect x={bx} y={by} width={barWidth} height={h} rx="6" fill="#6366f1" stroke="#4f46e5" strokeWidth="1" className="hover:opacity-85 transition cursor-pointer" />
                          <text x={bx + barWidth / 2} y={by - 6} fill="#4f46e5" fontSize="10" fontWeight="bold" textAnchor="middle">{fmt(yv)}</text>
                          <text x={bx + barWidth / 2} y="186" fill="#334155" fontSize="10" fontWeight="bold" textAnchor="middle">{String(xv).substring(0, 10)}</text>
                        </g>
                      );
                    })}
                  </svg>
                );
              })()}
            </div>
          )}

          {/* Line Chart (Light Modern Theme) */}
          {type === "line" && (
            <div className="p-4 bg-white rounded-xl border border-slate-300 shadow-sm">
              {(() => {
                const yNums = y.map(v => Number(v) || 0);
                const yMax = Math.max(...yNums, 100);
                const stepX = 350 / Math.max(1, x.length - 1);
                const pts = yNums.map((yv, i) => `${50 + i * stepX},${165 - ((yv / (yMax || 1)) * 120)}`).join(" ");

                return (
                  <svg className="w-full h-64" viewBox="0 0 450 210">
                    <line x1="40" y1="40" x2="430" y2="40" stroke="#e2e8f0" strokeDasharray="3" />
                    <line x1="40" y1="100" x2="430" y2="100" stroke="#e2e8f0" strokeDasharray="3" />
                    <line x1="40" y1="165" x2="430" y2="165" stroke="#cbd5e1" strokeWidth="1.5" />
                    <polyline points={pts} fill="none" stroke="#10b981" strokeWidth="3" strokeLinecap="round" />
                    {yNums.map((yv, i) => {
                      const cx = 50 + i * stepX;
                      const cy = 165 - ((yv / (yMax || 1)) * 120);
                      return (
                        <g key={i}>
                          <circle cx={cx} cy={cy} r="5.5" fill="#10b981" stroke="#ffffff" strokeWidth="2.5" className="hover:r-8 transition cursor-pointer shadow-sm" />
                          <text x={cx} y={cy - 10} fill="#059669" fontSize="10" fontWeight="bold" textAnchor="middle">{fmt(yv)}</text>
                          <text x={cx} y="186" fill="#334155" fontSize="9.5" fontWeight="bold" textAnchor="middle">{String(x[i] || "").substring(0, 7)}</text>
                        </g>
                      );
                    })}
                  </svg>
                );
              })()}
            </div>
          )}

          {/* Pie Chart (Light Modern Theme) */}
          {type === "pie" && (
            <div className="p-5 bg-white rounded-xl border border-slate-300 shadow-sm flex items-center justify-around flex-wrap gap-5">
              <svg className="w-48 h-48" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="38" fill="transparent" stroke="#6366f1" strokeWidth="18" strokeDasharray="140 238" strokeDashoffset="0" />
                <circle cx="50" cy="50" r="38" fill="transparent" stroke="#3b82f6" strokeWidth="18" strokeDasharray="64 238" strokeDashoffset="-140" />
                <circle cx="50" cy="50" r="38" fill="transparent" stroke="#10b981" strokeWidth="18" strokeDasharray="34 238" strokeDashoffset="-204" />
                <text x="50" y="52" fill="#0f172a" fontSize="10" fontWeight="bold" textAnchor="middle">Breakdown</text>
              </svg>
              <div className="space-y-2.5 text-xs md:text-sm font-mono">
                {x.map((xv, i) => (
                  <div key={i} className="flex items-center space-x-2.5">
                    <span className="w-3.5 h-3.5 rounded-full shadow-sm" style={{ backgroundColor: ['#6366f1', '#3b82f6', '#10b981', '#f59e0b', '#ec4899'][i % 5] }}></span>
                    <span className="text-slate-800"><strong className="text-slate-950">{xv}</strong>: {fmt(y[i])}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Footer Info & Download Link */}
          {chartPath && (
            <div className="flex items-center justify-between text-xs md:text-sm font-mono text-slate-600 pt-3 border-t border-slate-300">
              <span>Saved Artifact: <strong className="text-brand-700 font-bold">{chartPath}</strong></span>
              <a
                href={`/${chartPath}`}
                target="_blank"
                download
                className="px-3.5 py-1.5 bg-brand-50 hover:bg-brand-100 text-brand-700 rounded-lg border border-brand-300 font-bold transition flex items-center space-x-1.5 btn-lift"
              >
                <span>📥 Download PNG</span>
              </a>
            </div>
          )}
        </div>
      );
    }


    // Step Card Component
    function StepCard({ step, isExpandedDefault = true }) {
      const [expanded, setExpanded] = useState(isExpandedDefault);
      const [copied, setCopied] = useState(false);
      const isError = step.observation && step.observation.status === "error";
      const toolName = step.action ? step.action.tool : "get_schema";

      const handleCopy = () => {
        if (step.action && step.action.args) {
          navigator.clipboard.writeText(JSON.stringify(step.action.args, null, 2));
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }
      };

      return (
        <div className="bg-white rounded-2xl border border-slate-300 shadow-card overflow-hidden transition-all duration-200 hover:shadow-card-hover mb-5">
          {/* Step Header */}
          <div className="p-5 border-b border-slate-200 flex items-center justify-between flex-wrap gap-3 bg-white">
            <div className="flex items-center space-x-3.5">
              <span className="flex items-center justify-center w-9 h-9 rounded-full bg-brand-600 text-white font-extrabold text-sm shadow-pill">
                {step.step_index}
              </span>
              <div className="flex items-center space-x-2.5">
                <span className="font-mono text-xs md:text-sm font-bold px-3.5 py-1 rounded-full bg-slate-100 text-slate-800 border border-slate-300">
                  🔧 Tool: {toolName}()
                </span>
                <span className={`text-xs md:text-sm px-3.5 py-1 rounded-full font-bold flex items-center space-x-1 ${isError ? 'bg-rose-50 text-rose-700 border border-rose-300' : 'bg-emerald-50 text-emerald-700 border border-emerald-300'}`}>
                  <span>{isError ? '✕ ERROR' : '✓ SUCCESS'}</span>
                </span>
              </div>
            </div>

            <div className="flex items-center space-x-3">
              <span className="text-xs md:text-sm font-mono text-slate-600 bg-slate-50 px-3.5 py-1.5 rounded-lg border border-slate-300 flex items-center space-x-1.5 font-semibold">
                <span>⏱</span>
                <span>{step.duration_ms || 4} ms</span>
              </span>
              <button
                onClick={() => setExpanded(!expanded)}
                className="px-4 py-1.5 rounded-lg text-xs md:text-sm font-bold text-brand-600 bg-brand-50 hover:bg-brand-100 border border-brand-200 transition flex items-center space-x-1"
              >
                <span>{expanded ? '👁️ Hide' : '👁️ Show'}</span>
              </button>
            </div>
          </div>

          {/* Subtitle / summary */}
          <div className="px-6 py-3 bg-slate-50/70 border-b border-slate-200 text-sm text-slate-700 font-medium">
            {step.thought}
          </div>

          {/* Expanded Step Body */}
          {expanded && (
            <div className="p-6 space-y-5 bg-white">
              {/* Agent Reasoning */}
              <div>
                <div className="text-xs font-bold text-brand-700 uppercase tracking-wider mb-2 flex items-center space-x-1.5">
                  <span>🧠 AGENT REASONING / THOUGHT PROCESS</span>
                </div>
                <div className="p-4 rounded-xl bg-slate-50 border-l-4 border-brand-500 border border-slate-200 text-slate-800 text-sm md:text-base font-medium leading-relaxed">
                  {step.thought}
                </div>
              </div>

              {/* Tool Action Execution */}
              {step.action && (
                <div>
                  <div className="text-xs font-bold text-amber-700 uppercase tracking-wider mb-2 flex items-center justify-between">
                    <span>⚡ TOOL ACTION EXECUTION (CONTRACT 2)</span>
                    <span className="font-mono text-xs md:text-sm text-slate-600 font-bold">{step.action.tool}()</span>
                  </div>
                  <div className="relative">
                    <pre className="p-4 rounded-xl bg-slate-900 text-emerald-400 font-mono text-xs md:text-sm overflow-x-auto leading-relaxed border border-slate-800">
                      {JSON.stringify(step.action.args, null, 2)}
                    </pre>
                    <button
                      onClick={handleCopy}
                      className="absolute top-3 right-3 px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-mono font-bold transition flex items-center space-x-1"
                    >
                      <span>{copied ? '✓ Copied' : '📋 Copy'}</span>
                    </button>
                  </div>
                </div>
              )}

              {/* Observation */}
              {step.observation && (
                <div>
                  <div className="text-xs font-bold text-slate-600 uppercase tracking-wider mb-2 flex items-center justify-between">
                    <span>📋 TOOL OBSERVATION & DATABASE OUTPUT</span>
                    {step.observation.truncated && (
                      <span className="text-xs px-2.5 py-0.5 rounded bg-amber-100 text-amber-800 font-mono font-bold border border-amber-300">
                        ⚠️ Truncated to 20 Rows
                      </span>
                    )}
                  </div>

                  {step.observation.status === "error" && (
                    <div className="p-4 bg-rose-50 border border-rose-300 rounded-xl text-rose-800 mb-3 space-y-1">
                      <div className="font-bold text-sm md:text-base">{step.observation.error}</div>
                      {step.observation.hint && (
                        <div className="text-xs md:text-sm text-emerald-800 font-medium">💡 Hint: {step.observation.hint}</div>
                      )}
                    </div>
                  )}

                  {step.observation.status === "ok" && (
                    <div>
                      {step.observation.data && typeof step.observation.data === 'object' && (step.observation.data.chart_path || step.observation.data.spec) ? (
                        <DynamicChartRenderer
                          spec={step.observation.data.spec || (step.action && step.action.args ? step.action.args.spec : null)}
                          chartPath={step.observation.data.chart_path}
                        />
                      ) : Array.isArray(step.observation.data) && step.observation.data.length > 0 ? (
                        <div className="rounded-xl border border-slate-300 overflow-hidden bg-white shadow-sm">
                          <div className="overflow-x-auto max-h-72 custom-scrollbar">
                            <table className="w-full text-left text-xs md:text-sm font-mono">
                              <thead className="bg-slate-100 text-slate-800 uppercase sticky top-0 border-b border-slate-300">
                                <tr>
                                  {Object.keys(step.observation.data[0]).map((col) => (
                                    <th key={col} className="px-4 py-3 font-bold text-slate-900">{col}</th>
                                  ))}
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-200 text-slate-700">
                                {step.observation.data.map((row, idx) => (
                                  <tr key={idx} className="hover:bg-slate-50 transition">
                                    {Object.values(row).map((val, cIdx) => (
                                      <td key={cIdx} className="px-4 py-3 whitespace-nowrap font-medium text-slate-800">
                                        {typeof val === 'number' ? val.toLocaleString() : String(val)}
                                      </td>
                                    ))}
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      ) : (
                        <pre className="p-4 rounded-xl bg-slate-900 text-emerald-400 font-mono text-xs md:text-sm overflow-x-auto leading-relaxed border border-slate-800">
                          {typeof step.observation.data === 'object'
                            ? JSON.stringify(step.observation.data, null, 2)
                            : String(step.observation.data)}
                        </pre>
                      )}
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // Main App Component
    function App() {
      const [activeTab, setActiveTab] = useState("live");
      const [question, setQuestion] = useState("Analyze sales by region and create a bar chart showing which region has the highest sales.");

                          <td className="p-3.5 font-sans font-semibold text-slate-900">Average Latency</td>
                          <td className="p-3.5 text-emerald-700 font-extrabold text-sm md:text-base">185 ms</td>
                          <td className="p-3.5 text-slate-700 font-semibold">304 ms</td>
                        </tr>
                        <tr>
                          <td className="p-3.5 font-sans font-semibold text-slate-900">Latency Reduction</td>
                          <td className="p-3.5 text-emerald-700 font-extrabold text-sm md:text-base">39.2% saved</td>
                          <td className="p-3.5 text-slate-700 font-semibold">0% (Baseline)</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: SCHEMA EXPLORER */}
            {activeTab === "schema" && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl border border-slate-300 shadow-card">
                  <h3 className="font-extrabold text-base md:text-lg text-slate-900 mb-1">SQLite Database Relational Schema</h3>
                  <p className="text-xs md:text-sm text-slate-600 font-medium">Database tables with primary keys (PK) and foreign keys (FK).</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {["orders", "sales", "customers", "products", "regions"].map((tbl) => (
                    <div key={tbl} className="p-5 bg-white rounded-2xl border border-slate-300 shadow-card space-y-3">
                      <div className="flex items-center justify-between border-b border-slate-200 pb-2">
                        <span className="font-mono font-extrabold text-brand-800 text-sm uppercase">{tbl}</span>
                        <span className="text-xs font-mono font-bold px-2 py-0.5 bg-slate-100 text-slate-700 rounded border border-slate-300">TABLE</span>
                      </div>
                      <ul className="text-xs md:text-sm space-y-2 text-slate-800 font-mono">
                        {tbl === "orders" && (
                          <>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">order_id</span> <span className="text-amber-700 font-bold">INT PK</span></li>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">customer_id</span> <span className="text-indigo-700 font-bold">INT FK</span></li>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">product_id</span> <span className="text-indigo-700 font-bold">INT FK</span></li>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">region</span> <span className="text-slate-600 font-bold">TEXT</span></li>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">sales</span> <span className="text-emerald-700 font-bold">REAL</span></li>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">profit</span> <span className="text-emerald-700 font-bold">REAL</span></li>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">date</span> <span className="text-slate-600 font-bold">TEXT</span></li>
                          </>
                        )}
                        {tbl === "customers" && (
                          <>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">customer_id</span> <span className="text-amber-700 font-bold">INT PK</span></li>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">customer_name</span> <span className="text-slate-600 font-bold">TEXT</span></li>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">segment</span> <span className="text-slate-600 font-bold">TEXT</span></li>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">region_id</span> <span className="text-indigo-700 font-bold">INT FK</span></li>
                          </>
                        )}
                        {tbl === "products" && (
                          <>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">product_id</span> <span className="text-amber-700 font-bold">INT PK</span></li>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">product_name</span> <span className="text-slate-600 font-bold">TEXT</span></li>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">category</span> <span className="text-slate-600 font-bold">TEXT</span></li>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">unit_price</span> <span className="text-emerald-700 font-bold">REAL</span></li>
                          </>
                        )}
                        {tbl === "regions" && (
                          <>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">region_id</span> <span className="text-amber-700 font-bold">INT PK</span></li>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">region_name</span> <span className="text-slate-600 font-bold">TEXT</span></li>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">manager</span> <span className="text-slate-600 font-bold">TEXT</span></li>
                          </>
                        )}
                        {tbl === "sales" && (
                          <>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">id</span> <span className="text-amber-700 font-bold">INT PK</span></li>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">region</span> <span className="text-slate-600 font-bold">TEXT</span></li>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">sales_amount</span> <span className="text-emerald-700 font-bold">REAL</span></li>
                            <li className="flex items-center justify-between"><span className="font-semibold text-slate-900">year</span> <span className="text-slate-600 font-bold">INT</span></li>
                          </>
                        )}
                      </ul>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 5: TRAJECTORY REPLAY */}
            {activeTab === "replay" && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl border border-slate-300 shadow-card flex items-center justify-between flex-wrap gap-4">
                  <div>
                    <h2 className="text-lg md:text-xl font-extrabold text-slate-900 flex items-center space-x-2">
                      <span>📷 Trajectory Step-by-Step Replay</span>
                      <span className="text-xs px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-300 font-bold">
                        Audit & Verification
                      </span>
                    </h2>
                    <p className="text-xs md:text-sm text-slate-600 font-medium mt-1">Replay historical agent trajectory runs step-by-step with state verification.</p>
                  </div>
                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => handleRunQuery()}
                      className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-xs md:text-sm font-bold rounded-xl shadow-pill transition flex items-center space-x-1"
                    >
                      <span>▶️ Replay Execution</span>
                    </button>
                  </div>
                </div>

                <div className="space-y-4">
                  {liveRecord && liveRecord.steps.map((step) => (
                    <StepCard key={step.step_index} step={step} isExpandedDefault={true} />
                  ))}
                </div>
              </div>
            )}




          </main>
        </div>
      );
    }


    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
