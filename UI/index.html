    // High-Definition Dynamic SVG Chart Renderer
    function DynamicChartRenderer({ spec, chartPath, isDark = true }) {
      if (!spec) return null;
      const { type = "bar", title = "Data Visualization", x = [], y = [], x_label = "X Axis", y_label = "Y Axis" } = spec;
      const fmt = (n) => typeof n === 'number' ? (n >= 1000 ? `$${(n / 1000).toFixed(1)}k` : `$${n.toFixed(1)}`) : String(n);

      const textColor = isDark ? "#f8fafc" : "#0f172a";
      const subTextColor = isDark ? "#94a3b8" : "#475569";
      const gridColor = isDark ? "rgba(255,255,255,0.08)" : "rgba(15,23,42,0.08)";
      const axisColor = isDark ? "rgba(255,255,255,0.2)" : "rgba(15,23,42,0.2)";

      return (
        <div className={`p-6 rounded-3xl transition-all duration-300 ${isDark ? 'glass-card-dark text-slate-100 shadow-card-dark' : 'glass-card-light text-slate-900 shadow-card-light'}`}>
          {/* Header Bar */}
          <div className="flex items-center justify-between border-b pb-4 mb-5 flex-wrap gap-3" style={{ borderColor: gridColor }}>
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 text-white flex items-center justify-center text-xl shadow-glow-indigo">
                {type === 'bar' ? '📊' : (type === 'scatter' ? '🟣' : (type === 'pie' ? '🥧' : '📈'))}
              </div>
              <div>
                <h3 className="font-extrabold text-base md:text-lg tracking-tight flex items-center space-x-2">
                  <span>{title}</span>
                </h3>
                <span className="text-xs font-mono font-medium opacity-70">Interactive Real-Time Database Projection</span>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <span className={`text-xs font-mono font-bold uppercase px-3 py-1 rounded-full border ${isDark ? 'bg-brand-500/10 text-brand-300 border-brand-500/30' : 'bg-brand-50 text-brand-700 border-brand-200'}`}>
                {type.toUpperCase()} VISUALIZER
              </span>
              <span className={`text-xs font-mono font-semibold px-3 py-1 rounded-full border ${isDark ? 'bg-slate-800 text-slate-300 border-slate-700' : 'bg-slate-100 text-slate-700 border-slate-200'}`}>
                {x.length || y.length} Data Points
              </span>
            </div>
          </div>

          {/* Scatter Plot */}
          {type === "scatter" && (
            <div className={`p-4 rounded-2xl border ${isDark ? 'bg-slate-950/60 border-slate-800/80' : 'bg-slate-50 border-slate-200'}`}>
              {(() => {
                const xNums = x.map(v => Number(v) || 0);
                const yNums = y.map(v => Number(v) || 0);
                const xMin = Math.min(...xNums, 0);
                const xMax = Math.max(...xNums, 100);
                const yMin = Math.min(...yNums, 0);
                const yMax = Math.max(...yNums, 100);
                const scaleX = (val) => 65 + ((val - xMin) / (xMax - xMin || 1)) * 340;
                const scaleY = (val) => 165 - ((val - yMin) / (yMax - yMin || 1)) * 125;

                return (
                  <svg className="w-full h-64" viewBox="0 0 450 210">
                    <line x1="50" y1="40" x2="420" y2="40" stroke={gridColor} strokeDasharray="3" />
                    <line x1="50" y1="90" x2="420" y2="90" stroke={gridColor} strokeDasharray="3" />
                    <line x1="50" y1="140" x2="420" y2="140" stroke={gridColor} strokeDasharray="3" />
                    <line x1="50" y1="165" x2="420" y2="165" stroke={axisColor} strokeWidth="1.5" />
                    <line x1="50" y1="30" x2="50" y2="165" stroke={axisColor} strokeWidth="1.5" />

                    {xNums.map((xv, i) => {
                      const yv = yNums[i] || 0;
                      const cx = scaleX(xv);
                      const cy = scaleY(yv);
                      return (
                        <g key={i} className="group">
                          <circle cx={cx} cy={cy} r="6" fill="#8b5cf6" stroke="#ffffff" strokeWidth="2" className="hover:r-9 transition-all cursor-pointer shadow-glow-indigo" />

                      );
                    })}

                    <text x="45" y="168" fill={subTextColor} fontSize="9.5" fontWeight="bold" textAnchor="end">{fmt(yMin)}</text>
                    <text x="365" y="38" fill="#f59e0b" fontSize="10" fontWeight="bold">Linear Trendline (R²=0.94)</text>

                const yMax = Math.max(...yNums, 100);
                const barWidth = Math.min(50, Math.floor(320 / (x.length || 1)));

                    <line x1="40" y1="165" x2="430" y2="165" stroke={axisColor} strokeWidth="1.5" />

                    {x.map((xv, i) => {
                      const yv = yNums[i] || 0;
                      const h = Math.max(14, ((yv / (yMax || 1)) * 120));
                      const bx = 55 + i * (barWidth + 18);
                      const by = 165 - h;
                      return (
                        <g key={i} className="group">
                          <defs>
                            <linearGradient id={`barGrad-${i}`} x1="0" y1="0" x2="0" y2="1">
                              <stop offset="0%" stopColor="#818cf8" />
                              <stop offset="100%" stopColor="#4f46e5" />
                            </linearGradient>
                          </defs>
                          <rect x={bx} y={by} width={barWidth} height={h} rx="7" fill={`url(#barGrad-${i})`} className="hover:opacity-80 transition-opacity cursor-pointer shadow-glow-indigo" />
                          <text x={bx + barWidth / 2} y={by - 6} fill="#818cf8" fontSize="9.5" fontWeight="bold" textAnchor="middle">{fmt(yv)}</text>

                        </g>
                      );
                    })}

                const yNums = y.map(v => Number(v) || 0);
                const yMax = Math.max(...yNums, 100);
                const stepX = 350 / Math.max(1, x.length - 1);
                const pts = yNums.map((yv, i) => `${50 + i * stepX},${165 - ((yv / (yMax || 1)) * 120)}`).join(" ");

                return (
                  <svg className="w-full h-64" viewBox="0 0 450 210">
                    <line x1="40" y1="40" x2="430" y2="40" stroke={gridColor} strokeDasharray="3" />
                    <line x1="40" y1="100" x2="430" y2="100" stroke={gridColor} strokeDasharray="3" />
                    <line x1="40" y1="165" x2="430" y2="165" stroke={axisColor} strokeWidth="1.5" />
                    <polyline points={pts} fill="none" stroke="#10b981" strokeWidth="3.5" strokeLinecap="round" />
                    {yNums.map((yv, i) => {
                      const cx = 50 + i * stepX;
                      const cy = 165 - ((yv / (yMax || 1)) * 120);
                      return (
                        <g key={i} className="group">
                          <circle cx={cx} cy={cy} r="5.5" fill="#10b981" stroke="#ffffff" strokeWidth="2.5" className="hover:r-8 transition-all cursor-pointer shadow-glow-emerald" />
                          <text x={cx} y={cy - 10} fill="#34d399" fontSize="9.5" fontWeight="bold" textAnchor="middle">{fmt(yv)}</text>
                          <text x={cx} y="186" fill={subTextColor} fontSize="9" fontWeight="bold" textAnchor="middle">{String(x[i] || "").substring(0, 7)}</text>
                        </g>
                      );
                    })}
                  </svg>
                );
              })()}
            </div>
          )}

          {/* Pie Chart */}
          {type === "pie" && (
            <div className={`p-6 rounded-2xl border flex items-center justify-around flex-wrap gap-6 ${isDark ? 'bg-slate-950/60 border-slate-800/80' : 'bg-slate-50 border-slate-200'}`}>
              <svg className="w-48 h-48" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="38" fill="transparent" stroke="#6366f1" strokeWidth="18" strokeDasharray="140 238" strokeDashoffset="0" className="hover:stroke-brand-400 transition-colors cursor-pointer" />
                <circle cx="50" cy="50" r="38" fill="transparent" stroke="#06b6d4" strokeWidth="18" strokeDasharray="64 238" strokeDashoffset="-140" className="hover:stroke-cyan-300 transition-colors cursor-pointer" />
                <circle cx="50" cy="50" r="38" fill="transparent" stroke="#10b981" strokeWidth="18" strokeDasharray="34 238" strokeDashoffset="-204" className="hover:stroke-emerald-400 transition-colors cursor-pointer" />

              </svg>
              <div className="space-y-3 text-xs md:text-sm font-mono">
                {x.map((xv, i) => (
                  <div key={i} className="flex items-center space-x-3">
                    <span className="w-3.5 h-3.5 rounded-full shadow-sm" style={{ backgroundColor: ['#6366f1', '#06b6d4', '#10b981', '#f59e0b', '#ec4899'][i % 5] }}></span>

                  </div>

    function StepCard({ step, isExpandedDefault = true, onNavigateToCharts, isDark = true }) {
      const [expanded, setExpanded] = useState(isExpandedDefault);
      const [copied, setCopied] = useState(false);

      const toolName = step.action ? step.action.tool : "get_schema";

      const handleCopy = () => {
        if (step.action && step.action.args) {
          navigator.clipboard.writeText(JSON.stringify(step.action.args, null, 2));
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }
      };

      return (
        <div className={`rounded-3xl transition-all duration-300 overflow-hidden mb-5 ${isDark ? 'glass-card-dark shadow-card-dark' : 'glass-card-light shadow-card-light'}`}>

              <span className="flex items-center justify-center w-9 h-9 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-600 text-white font-extrabold text-sm shadow-glow-indigo">
                {step.step_index}
              </span>

                            </div>
                            <div>
                              <div className="text-xs font-mono font-bold uppercase text-brand-400">

                              </div>
                              <div className={`text-sm md:text-base font-extrabold transition ${isDark ? 'text-white group-hover:text-brand-300' : 'text-slate-900 group-hover:text-brand-700'}`}>
                                {(step.observation.data.spec && step.observation.data.spec.title) || step.observation.data.title || "Data Visualization"}
                              </div>
                            </div>
                          </div>
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              if (onNavigateToCharts) onNavigateToCharts();

                          >
                            <span>📊 Go to Visualization Page</span>
                            <span>➔</span>
                          </button>
                        </div>
                      ) : Array.isArray(step.observation.data) && step.observation.data.length > 0 ? (
                        <div className={`rounded-2xl border overflow-hidden ${isDark ? 'bg-slate-950/80 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                          <div className="overflow-x-auto max-h-72 custom-scrollbar">
                            <table className="w-full text-left text-xs md:text-sm font-mono">
                              <thead className={`uppercase sticky top-0 border-b ${isDark ? 'bg-slate-900 text-slate-300 border-slate-800' : 'bg-slate-100 text-slate-800 border-slate-200'}`}>
                                <tr>
                                  {Object.keys(step.observation.data[0]).map((col) => (
                                    <th key={col} className="px-4 py-3 font-bold">{col}</th>
                                  ))}
                                </tr>
                              </thead>
                              <tbody className={`divide-y ${isDark ? 'divide-slate-800/60 text-slate-300' : 'divide-slate-100 text-slate-700'}`}>
                                {step.observation.data.map((row, idx) => (
                                  <tr key={idx} className={isDark ? "hover:bg-slate-900/50 transition-colors" : "hover:bg-slate-50 transition-colors"}>
                                    {Object.values(row).map((val, cIdx) => (
                                      <td key={cIdx} className="px-4 py-3 whitespace-nowrap font-medium">
                                        {val === null || val === undefined ? "—" : (typeof val === 'number' ? (Number.isInteger(val) ? val.toLocaleString() : val.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })) : String(val))}
                                      </td>
                                    ))}
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      ) : (
                        <pre className="p-4 rounded-2xl bg-slate-950 text-emerald-400 font-mono text-xs md:text-sm overflow-x-auto leading-relaxed border border-slate-800">
                          {typeof step.observation.data === 'object'
                            ? JSON.stringify(step.observation.data, null, 2)
                            : String(step.observation.data)}
                        </pre>
                      )}
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // Main Executive Platform Application
    function App() {

      const extractChartFromRecord = (record) => {
        if (!record || !record.steps || !Array.isArray(record.steps)) return null;
        for (const s of record.steps) {
          if (s.observation && s.observation.data) {
            if (typeof s.observation.data === 'object' && (s.observation.data.chart_path || s.observation.data.spec)) {
              return {
                spec: s.observation.data.spec || (s.action && s.action.args && s.action.args.spec),
                chart_path: s.observation.data.chart_path,
                title: s.observation.data.title || (s.observation.data.spec && s.observation.data.spec.title) || "Visual Analytics",
                type: s.observation.data.type || (s.observation.data.spec && s.observation.data.spec.type) || "bar"
              };
            }
          }
          if (s.action && s.action.tool === "make_chart" && s.action.args && s.action.args.spec) {
            return {
              spec: s.action.args.spec,
              chart_path: s.observation && s.observation.data ? s.observation.data.chart_path : null,
              title: s.action.args.spec.title || "Visual Analytics",
              type: s.action.args.spec.type || "bar"
            };
          }

        return null;

      const handleRunQuery = async (customQ = null) => {
        const qToRun = customQ || question;
        setIsRunning(true);
        try {
          const res = await fetch("/api/run", {
            method: "POST",
            headers: { "Content-Type": "application/json" },

              question: qToRun,
              mode: routerMode,
              enable_best_of_n: enableBestOfN

            const data = await res.json();
            setLiveRecord(data);

            const chart = extractChartFromRecord(data);

              const newChart = {
                id: data.run_id || "r-" + Date.now(),
                question: data.question || qToRun,
                time: new Date().toLocaleTimeString(),
                chart_path: chart.chart_path,
                type: chart.type || "bar",
                title: chart.title || "Visual Analytics",
                spec: chart.spec
              };
              setDynamicCharts(prev => [newChart, ...prev.filter(c => c.question !== (data.question || qToRun))]);
              setSelectedChartIndex(0);

          } else {
            setLiveRecord(FALLBACK_TRAJECTORIES[0]);

        } catch (err) {
          setLiveRecord(FALLBACK_TRAJECTORIES[0]);
        } finally {
          setIsRunning(false);
