<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic AI Analyst — Enterprise Console</title>

  <!-- Typography: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- React 18 & Babel CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Dark Theme (Default) */
    :root {
      --bg: #0B0D17;
      --bg-gradient: radial-gradient(1200px 600px at 15% -10%, rgba(139,92,246,0.12), transparent 60%), radial-gradient(1000px 500px at 100% 0%, rgba(45,212,191,0.08), transparent 55%), #0B0D17;
      --panel: #12141F;
      --panel-2: #0E0F1A;
      --panel-3: #171A29;
      --border: #262A3D;
      --border-soft: #1D2033;
      --violet: #8B5CF6;
      --violet-2: #A78BFA;
      --pink: #EC4899;
      --blue: #6366F1;
      --teal: #2DD4BF;
      --teal-dim: #134E4A;
      --green: #34D399;
      --green-dim: #14532D;
      --amber: #FBBF24;
      --text: #F1F2F6;
      --text-dim: #9CA1B5;
      --text-faint: #656B82;
      --card-hover-shadow: 0 10px 28px rgba(0,0,0,0.4);
      --sans: 'Inter', -apple-system, sans-serif;
      --mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace;
    }

    /* Light / White Theme (High Contrast & Sharp Typography) */
    body.light-mode {
      --bg: #F8FAFC;
      --bg-gradient: radial-gradient(1200px 600px at 15% -10%, rgba(139,92,246,0.08), transparent 60%), radial-gradient(1000px 500px at 100% 0%, rgba(45,212,191,0.06), transparent 55%), #F8FAFC;
      --panel: #FFFFFF;
      --panel-2: #F8FAFC;
      --panel-3: #EDE9FE;
      --border: #CBD5E1;
      --border-soft: #E2E8F0;
      --violet: #7C3AED;
      --violet-2: #6D28D9;
      --pink: #DB2777;
      --blue: #4F46E5;
      --teal: #0F766E;
      --teal-dim: #CCFBF1;
      --green: #047857;
      --green-dim: #D1FAE5;
      --amber: #B45309;
      --text: #0F172A;
      --text-dim: #1E293B;
      --text-faint: #475569;
      --card-hover-shadow: 0 10px 28px rgba(15,23,42,0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg-gradient);
      color: var(--text);
      font-family: var(--sans);
      padding: 28px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      font-size: 15px;
      line-height: 1.6;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .wrap { max-width: 1440px; margin: 0 auto; }

    /* ===== HEADER ===== */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 24px;
      background: var(--panel);
      border: 1.5px solid var(--border-soft);
      border-radius: 16px;
      margin-bottom: 24px;
      box-shadow: var(--card-hover-shadow);
      transition: all 0.3s ease;
    }
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand-mark {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, var(--blue), var(--violet));
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; box-shadow: 0 6px 18px rgba(99,102,241,0.35);
      flex-shrink: 0; color: #fff;
    }
    .brand-text { display: flex; flex-direction: column; }
    .brand-title-row { display: flex; align-items: center; gap: 12px; }
    .brand-title-row h1 {
      margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; color: var(--text);
    }
    .ver-tag {
      font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--teal);
      border: 1.5px solid rgba(45,212,191,0.4); background: rgba(45,212,191,0.1);
      padding: 3px 9px; border-radius: 20px; letter-spacing: 0.04em;
    }
    body.light-mode .ver-tag {
      color: #0F766E; border-color: #5EEAD4; background: #CCFBF1;
    }
    .brand-text .sub { font-size: 13.5px; color: var(--text-dim); margin-top: 3px; font-weight: 600; }

    .nav { display: flex; align-items: center; gap: 8px; }
    .nav a, .nav button {
      font-size: 14px; font-weight: 700; color: var(--text-dim);
      text-decoration: none; padding: 10px 16px; border-radius: 10px;
      display: flex; align-items: center; gap: 8px; transition: all .15s ease;
      border: 1px solid transparent; background: transparent; cursor: pointer;
      font-family: var(--sans);
    }
    .nav a:hover, .nav button:hover { color: var(--text); background: var(--panel-3); }
    .nav a.active, .nav button.active {
      background: linear-gradient(135deg, var(--blue), var(--violet));
      color: #fff !important; box-shadow: 0 4px 14px rgba(99,102,241,0.35);
    }
    .nav .count {
      font-size: 11px; font-weight: 800; background: rgba(255,255,255,0.22); color: #fff;
      padding: 2px 8px; border-radius: 20px;
    }
    .nav-icon { font-size: 15px; line-height: 1; }

    .theme-toggle-btn {
      width: 42px; height: 42px; border-radius: 12px; border: 1.5px solid var(--border);
      background: var(--panel-3); display: flex; align-items: center; justify-content: center;
      color: var(--amber); margin-left: 8px; flex-shrink: 0; cursor: pointer;
      font-size: 18px; transition: all .15s ease;
    }
    .theme-toggle-btn:hover {
      transform: scale(1.06); border-color: var(--violet);
    }

    /* ===== GRID ===== */
    .grid { display: grid; grid-template-columns: 0.95fr 1.15fr; gap: 24px; align-items: start; }
    @media (max-width: 1024px) { .grid { grid-template-columns: 1fr; } }

    .panel {
      background: var(--panel);
      border: 1.5px solid var(--border-soft);
      border-radius: 18px;
      padding: 24px;
      box-shadow: var(--card-hover-shadow);
      transition: all 0.3s ease;
    }
    .panel-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .panel-title { display: flex; align-items: center; gap: 12px; }
    .panel-title .icon {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 18px;
      background: var(--panel-3); border: 1.5px solid var(--border);
    }
    .panel-title h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; color: var(--text); }
    .agent-tag {
      display: flex; align-items: center; gap: 7px;
      font-size: 13px; font-weight: 700; color: var(--violet-2);
      border: 1.5px solid rgba(139,92,246,0.35); background: rgba(139,92,246,0.1);
      padding: 8px 14px; border-radius: 20px; white-space: nowrap;
    }
    body.light-mode .agent-tag {
      color: #6D28D9; border-color: #C4B5FD; background: #F5F3FF;
    }

    /* Query field */
    .field-label {
      font-size: 12.5px; font-weight: 800; color: var(--text-dim);
      letter-spacing: 0.07em; display: flex; justify-content: space-between; margin-bottom: 10px;
    }
    .query-box {
      background: var(--panel-2); border: 1.5px solid var(--border);
      border-radius: 14px; padding: 18px; font-size: 16px; line-height: 1.6; color: var(--text);
    }
    body.light-mode .query-box {
      background: #FFFFFF; border-color: #CBD5E1; box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
    }
    .query-textarea {
      width: 100%; background: transparent; border: none; outline: none;
      color: var(--text); font-family: var(--sans); font-size: 16px;
      line-height: 1.6; resize: vertical; min-height: 70px; font-weight: 600;
    }

    .card-row {
      margin-top: 18px; border: 1.5px solid rgba(139,92,246,0.35); border-radius: 14px;
      background: linear-gradient(180deg, rgba(139,92,246,0.09), rgba(139,92,246,0.03));
      overflow: hidden;
    }
    body.light-mode .card-row {
      background: linear-gradient(180deg, #FAF5FF, #F5F3FF); border-color: #C4B5FD;
    }
    .card-row-top {
      display: flex; align-items: center; gap: 12px; padding: 16px 18px 12px;
    }
    .pill {
      font-size: 12px; font-weight: 800; letter-spacing: 0.02em;
      padding: 5px 12px; border-radius: 20px; border: 1.5px solid; display: inline-flex; align-items: center; gap: 6px;
    }
    .pill.violet { color: #C4B5FD; border-color: rgba(139,92,246,0.4); background: rgba(139,92,246,0.14); }
    body.light-mode .pill.violet { color: #5B21B6; border-color: #C4B5FD; background: #EDE9FE; }

    .pill.teal { color: var(--teal); border-color: rgba(45,212,191,0.4); background: rgba(45,212,191,0.12); }
    body.light-mode .pill.teal { color: #0F766E; border-color: #5EEAD4; background: #CCFBF1; }

    .pill.green { color: var(--green); border-color: rgba(52,211,153,0.4); background: rgba(52,211,153,0.12); }
    body.light-mode .pill.green { color: #065F46; border-color: #A7F3D0; background: #D1FAE5; }

    .pill.amber { color: var(--amber); border-color: rgba(251,191,36,0.4); background: rgba(251,191,36,0.12); }
    body.light-mode .pill.amber { color: #92400E; border-color: #FDE68A; background: #FEF3C7; }

    .card-row-top strong { font-size: 16px; color: var(--text); font-weight: 800; }

    .card-row-mid {
      display: flex; gap: 18px; padding: 0 18px 14px; font-size: 14px; color: var(--text-dim); font-weight: 700;
    }
    .card-row-mid b { color: var(--text); }
    .card-row-bottom {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-top: 1px solid var(--border-soft);
      font-size: 13.5px; color: var(--text-dim); font-weight: 600;
    }
    .kbd-hint {
      font-family: var(--mono); font-size: 12px; color: var(--text-faint);
      background: var(--panel-3); border: 1px solid var(--border); padding: 4px 9px; border-radius: 6px; font-weight: 700;
    }
    body.light-mode .kbd-hint {
      background: #EDE9FE; border-color: #C4B5FD; color: #4C1D95;
    }

    .run-btn {
      margin-top: 20px; width: 100%; border: none;
      background: linear-gradient(135deg, var(--violet) 0%, var(--pink) 100%);
      color: #fff; font-size: 16px; font-weight: 800;
      letter-spacing: 0.01em; padding: 17px; border-radius: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 8px 22px rgba(236,72,153,0.35);
      transition: transform .15s ease, box-shadow .15s ease;
      font-family: var(--sans);
    }
    .run-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(236,72,153,0.45); }
    .run-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .suite { margin-top: 26px; }
    .suite-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .suite-head .label { font-size: 13.5px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 7px; }
    .filter-tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 10px; border: 1.5px solid var(--border-soft); }
    body.light-mode .filter-tabs { background: #F1F5F9; border-color: #CBD5E1; }
    .filter-tabs span {
      font-size: 12px; font-weight: 800; padding: 5px 12px; border-radius: 8px;
      color: var(--text-faint); cursor: pointer; transition: all .15s ease;
    }
    .filter-tabs span.active { background: var(--violet); color: #fff !important; }

    .task-list { border: 1.5px solid var(--border-soft); border-radius: 14px; overflow: hidden; }
    .task-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--border-soft); font-size: 14.5px; font-weight: 700;
      background: var(--panel-2); cursor: pointer; transition: background .15s ease;
    }
    body.light-mode .task-item { background: #FFFFFF; border-bottom-color: #F1F5F9; color: #0F172A; }
    .task-item:hover { background: var(--panel-3); }
    .task-item:last-child { border-bottom: none; }
    .task-id { font-family: var(--mono); color: var(--blue); font-size: 12.5px; margin-right: 10px; font-weight: 800; }
    .task-diff {
      font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 20px;
      border: 1.5px solid rgba(52,211,153,0.4); color: var(--green); background: rgba(52,211,153,0.1);
    }
    body.light-mode .task-diff {
      border-color: #A7F3D0; color: #047857; background: #D1FAE5;
    }

    /* ===== RIGHT: PIPELINE ===== */
    .pipeline {
      background: var(--panel); border: 1.5px solid var(--border-soft); border-radius: 18px;
      padding: 24px; margin-bottom: 22px; box-shadow: var(--card-hover-shadow);
    }
    .pipeline-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .stage-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .stage-badge {
      font-size: 13.5px; font-weight: 800; padding: 10px 16px; border-radius: 12px;
      border: 1.5px solid var(--border); background: var(--panel-3); color: var(--text-dim);
    }
    .stage-badge.p1 { color: #C4B5FD; border-color: rgba(139,92,246,0.4); background: rgba(139,92,246,0.12); }
    body.light-mode .stage-badge.p1 { color: #5B21B6; border-color: #C4B5FD; background: #EDE9FE; }

    .stage-badge.p2 { color: #93C5FD; border-color: rgba(99,102,241,0.4); background: rgba(99,102,241,0.12); }
    body.light-mode .stage-badge.p2 { color: #3730A3; border-color: #A5B4FC; background: #E0E7FF; }

    .stage-badge.p3 { color: #F0ABFC; border-color: rgba(217,70,239,0.4); background: rgba(217,70,239,0.1); }
    body.light-mode .stage-badge.p3 { color: #86198F; border-color: #F0ABFC; background: #FDF4FF; }

    .stage-badge.p4 { color: var(--green); border-color: rgba(52,211,153,0.4); background: rgba(52,211,153,0.12); }
    body.light-mode .stage-badge.p4 { color: #065F46; border-color: #6EE7B7; background: #ECFDF5; }

    .arrow { color: var(--text-dim); font-size: 16px; font-weight: 800; }
    .logged {
      display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 800; color: var(--text-dim);
      background: var(--panel-2); border: 1.5px solid var(--border-soft); padding: 8px 14px; border-radius: 20px;
    }
    body.light-mode .logged { background: #F1F5F9; border-color: #CBD5E1; color: #0F172A; }

    /* ===== RESULT ===== */
    .result {
      border: 1.5px solid rgba(52,211,153,0.4); border-radius: 18px; overflow: hidden;
      background: linear-gradient(180deg, rgba(52,211,153,0.08), rgba(18,20,31,0.6));
      box-shadow: var(--card-hover-shadow);
    }
    body.light-mode .result {
      background: linear-gradient(180deg, #F0FDF4, #FFFFFF); border-color: #86EFAC;
    }
    .result-head {
      display: flex; align-items: flex-start; gap: 16px; padding: 24px 24px 20px;
    }
    .check {
      width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--green), var(--teal));
      color: #04241A; display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 900; box-shadow: 0 6px 18px rgba(52,211,153,0.35);
    }
    .result-head h3 { margin: 0 0 8px; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; color: var(--text); }
    .result-head p { margin: 0; font-size: 14.5px; color: var(--text-dim); line-height: 1.6; font-weight: 500; }
    .tag-row { display: flex; gap: 10px; margin-bottom: 12px; }

    .answer-block {
      margin: 0 24px 20px; padding: 22px; background: var(--panel-2);
      border: 1.5px solid var(--border-soft); border-radius: 14px;
    }
    body.light-mode .answer-block {
      background: #FFFFFF; border-color: #E2E8F0; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .answer-block .eyebrow {
      font-size: 12.5px; font-weight: 800; color: var(--amber);
      letter-spacing: 0.04em; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .answer-block p { margin: 0; font-size: 16.5px; line-height: 1.75; color: var(--text); font-weight: 600; }
    .answer-block .fig { color: var(--teal); font-weight: 800; }

    .viz-card {
      margin: 0 24px 24px; display: flex; align-items: center; gap: 18px;
      padding: 18px; border: 1.5px solid var(--border); border-radius: 14px;
      background: linear-gradient(135deg, rgba(139,92,246,0.08), rgba(236,72,153,0.05));
      cursor: pointer; transition: all .15s ease;
    }
    body.light-mode .viz-card {
      background: linear-gradient(135deg, #FAF5FF, #FDF2F8); border-color: #DDD6FE;
    }
    .viz-card:hover { border-color: var(--violet); transform: translateY(-1px); }
    .viz-thumb {
      width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--blue), var(--violet));
      display: flex; align-items: end; justify-content: center; gap: 5px; padding: 10px;
      box-shadow: 0 6px 16px rgba(99,102,241,0.3);
    }
    .viz-thumb i { width: 6px; background: #fff; border-radius: 2px; opacity: 0.9; }
    .viz-info { flex: 1; }
    .viz-info .tags { display: flex; gap: 8px; margin-bottom: 8px; }
    .viz-info h4 { margin: 0 0 4px; font-size: 16.5px; font-weight: 800; color: var(--text); }
    .viz-info span { font-size: 13.5px; color: var(--text-dim); font-weight: 500; }
    .viz-arrow { color: var(--text-dim); font-size: 20px; font-weight: 800; }
    .pill.mini { font-size: 10.5px; padding: 4px 9px; }

    /* ===== STEP CARDS ===== */
    .step-card {
      background: var(--panel); border: 1.5px solid var(--border); border-radius: 14px;
      margin-top: 18px; overflow: hidden; box-shadow: var(--card-hover-shadow);
    }
    .step-card-header {
      padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1.5px solid var(--border-soft); background: var(--panel-2);
    }
    body.light-mode .step-card-header { background: #F8FAFC; }
    .step-badge {
      font-family: var(--mono); font-size: 13px; font-weight: 800;
      background: var(--panel-3); color: var(--text); padding: 4px 10px; border-radius: 8px;
      margin-right: 10px;
    }
    .step-thought {
      padding: 16px 20px; font-size: 15px; color: var(--text-dim); line-height: 1.6; font-weight: 600;
      border-bottom: 1.5px solid var(--border-soft);
    }
    .step-body { padding: 18px 20px; background: var(--panel-2); }
    body.light-mode .step-body { background: #FFFFFF; }
    .code-box {
      background: var(--panel-3); border: 1.5px solid var(--border-soft); border-radius: 8px;
      padding: 14px; font-family: var(--mono); font-size: 13.5px; color: var(--violet-2);
      overflow-x: auto; margin: 10px 0; line-height: 1.6; font-weight: 600;
    }
    body.light-mode .code-box {
      background: #F1F5F9; border-color: #CBD5E1; color: #4338CA;
    }
    .table-box {
      width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 13.5px;
      margin-top: 10px;
    }
    .table-box th {
      text-align: left; padding: 10px 14px; background: var(--panel); color: var(--text-dim);
      border-bottom: 1.5px solid var(--border); font-weight: 800;
    }
    body.light-mode .table-box th { background: #F8FAFC; color: #0F172A; }
    .table-box td {
      padding: 10px 14px; border-bottom: 1px solid var(--border-soft); color: var(--text); font-weight: 500;
    }

    /* ===== SCHEMA VIEW ===== */
    .schema-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; margin-top: 22px;
    }
    .schema-card {
      background: var(--panel); border: 1.5px solid var(--border); border-radius: 14px; padding: 20px;
    }
    .schema-head {
      display: flex; align-items: center; justify-content: space-between; border-bottom: 1.5px solid var(--border-soft);
      padding-bottom: 12px; margin-bottom: 14px;
    }
    .schema-head h3 { margin: 0; font-family: var(--mono); font-size: 17px; color: var(--violet-2); font-weight: 800; }
    body.light-mode .schema-head h3 { color: #5B21B6; }

    /* ===== REPLAY STUDIO ===== */
    .replay-controls {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;
      padding: 16px 20px; background: var(--panel-2); border-radius: 14px; border: 1.5px solid var(--border-soft);
      margin-bottom: 22px;
    }
    body.light-mode .replay-controls { background: #FFFFFF; border-color: #E2E8F0; }
    .ctrl-btn {
      font-size: 13.5px; font-weight: 700; padding: 8px 16px; border-radius: 10px;
      border: 1.5px solid var(--border); background: var(--panel); color: var(--text);

                      {expandedTable === tbl.name ? "✕ Close Preview" : "🔍 Preview Rows"}
                    </button>

                    {expandedTable === tbl.name && tbl.sample_rows && (
                      <div style={{ marginTop: "12px", overflowX: "auto" }}>
                        <table className="table-box" style={{ fontSize: "12.5px" }}>
                          <thead>
                            <tr>{Object.keys(tbl.sample_rows[0] || {}).map(k => <th key={k}>{k}</th>)}</tr>
                          </thead>
                          <tbody>
                            {tbl.sample_rows.map((r, i) => (
                              <tr key={i}>{Object.values(r).map((v, idx) => <td key={idx}>{String(v)}</td>)}</tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
