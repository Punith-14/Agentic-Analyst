[pytest]
# Only tests/ — nothing else.
#
# Without this, pytest's default patterns (test_*.py AND *_test.py) swept up
# scripts/smoke_test.py, whose first function shells out to pytest. That run
# collected smoke_test.py again, which shelled out again, and so on until the
# machine fell over. It looked like a hang in the test suite; it was pytest
# recursively invoking itself.
testpaths = tests

# Belt and braces: even if someone points pytest at scripts/ directly, only
# files literally named test_*.py are collected. smoke_test.py is not.
python_files = test_*.py

addopts = -q
